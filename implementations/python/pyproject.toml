[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "belgavi-cassandra-mcp"
version = "0.2.0"
description = "Bounded read-only Cassandra MCP server"
authors = [{name = "Sandeep Belgavi"}]
requires-python = ">=3.11,<3.14"
dependencies = ["mcp==1.30.0", "cassandra-driver==3.30.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
belgavi-cassandra-mcp = "cassandra_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
