# Author: Sandeep Belgavi
name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Sandeep-BA/agent-decision-lab
          ref: 2cb89d7
          path: agent-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r site/requirements.txt
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python scripts/build_learning_site.py --agent-root agent-source --output site-preview
      - name: Test mission journey without production analytics
        run: |
          python -m http.server 9194 --bind 127.0.0.1 --directory site-preview &
          node scripts/test_mission_browser.cjs
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: npm ci --ignore-scripts
      - run: python -m venv implementations/python/.venv
      - run: implementations/python/.venv/bin/python -m pip install -e 'implementations/python[test]'
      - run: implementations/python/.venv/bin/python -m pytest implementations/python/tests -q
      - run: mvn -B -f implementations/java/pom.xml verify
      - run: node scripts/check_transports.mjs
      - run: python scripts/validate_catalog.py
