# Author: Sandeep Belgavi
name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: npm ci --ignore-scripts
      - run: python -m venv implementations/python/.venv
      - run: implementations/python/.venv/bin/python -m pip install -e 'implementations/python[test]'
      - run: implementations/python/.venv/bin/python -m pytest implementations/python/tests -q
      - run: mvn -B -f implementations/java/pom.xml verify
      - run: node scripts/check_transports.mjs
      - run: python scripts/validate_catalog.py
